<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f766e">
    <title>לוח הסעות וחוגים · משפחת ברק</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background:
                radial-gradient(ellipse 90% 60% at 10% -10%, rgba(13, 148, 136, 0.12), transparent 50%),
                radial-gradient(ellipse 70% 50% at 100% 0%, rgba(194, 65, 12, 0.08), transparent 45%),
                #f4f1eb;
            color: #1c1917;
            -webkit-tap-highlight-color: transparent;
        }
        .day-nav-btn.active {
            background: #0f766e;
            color: #fff;
            border-color: #0f766e;
            box-shadow: 0 4px 10px rgba(15, 118, 110, 0.25);
        }
        .filter-btn.active {
            background: #0f766e;
            color: #fff;
            border-color: #0f766e;
        }
        .chip-or { background: #ccfbf1; color: #115e59; border-color: #99f6e4; }
        .chip-romi { background: #ffedd5; color: #9a3412; border-color: #fed7aa; }
        .chip-oz { background: #dbeafe; color: #1e3a8a; border-color: #bfdbfe; }
        .chip-drive { background: #fef3c7; color: #92400e; border-color: #fde68a; }
        .chip-pickup { background: #fff7ed; color: #9a3412; border-color: #fdba74; }
        .chip-school { background: #f3e8ff; color: #6b21a8; border-color: #e9d5ff; }
        .empty-slot { color: #a8a29e; font-style: italic; }
        .touch { min-height: 44px; touch-action: manipulation; }
    </style>
</head>
<body class="min-h-screen antialiased">

    <header class="sticky top-0 z-40 border-b border-stone-200/80 bg-[#f4f1eb]/95 backdrop-blur-md">
        <div class="max-w-5xl mx-auto px-3 sm:px-5 py-3">
            <div class="flex flex-wrap items-end justify-between gap-2 mb-3">
                <div>
                    <p class="text-[10px] sm:text-xs font-bold tracking-wide text-teal-800 uppercase">מערכת שבועית</p>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-stone-900 leading-tight">לוח הסעות וחוגים</h1>
                </div>
                <div id="today-badge" class="text-xs font-bold px-3 py-1.5 rounded-full bg-teal-800 text-white"></div>
            </div>

            <div id="days-bar" class="grid grid-cols-6 gap-1 sm:gap-1.5 mb-2.5"></div>

            <div class="flex gap-1.5 overflow-x-auto pb-0.5">
                <button type="button" class="filter-btn active shrink-0 px-3 py-1.5 rounded-full border text-xs font-bold touch" data-filter="all">הכל</button>
                <button type="button" class="filter-btn shrink-0 px-3 py-1.5 rounded-full border border-stone-300 text-xs font-bold text-stone-700 touch" data-filter="or">אור</button>
                <button type="button" class="filter-btn shrink-0 px-3 py-1.5 rounded-full border border-stone-300 text-xs font-bold text-stone-700 touch" data-filter="romi">רומי</button>
                <button type="button" class="filter-btn shrink-0 px-3 py-1.5 rounded-full border border-stone-300 text-xs font-bold text-stone-700 touch" data-filter="oz">עוז</button>
                <button type="button" class="filter-btn shrink-0 px-3 py-1.5 rounded-full border border-stone-300 text-xs font-bold text-stone-700 touch" data-filter="drive">הסעות</button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-3 sm:px-5 py-4 sm:py-5" id="schedule-root"></main>

    <footer class="max-w-5xl mx-auto px-3 sm:px-5 pb-8 text-center text-[11px] text-stone-500">
        משפחת ברק · לוח חוגים והסעות
    </footer>

    <script>
        const DAYS_HE = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];

        const schedule = [
            {
                day: 'ראשון',
                driver: 'אבא',
                or: [{ title: 'שיעור עם יפית', time: '15:30–16:15', place: 'בבית' }],
                romi: [],
                oz: [{ title: 'ג׳ודו', time: '16:15–17:15', place: 'אפולוניה' }],
                ozLesson: null,
                schoolReturn: 'אור ועוז חוזרים יחד ב־13:30',
                romiPickup: { time: '16:00', place: 'מהגן' },
                orPickup: null
            },
            {
                day: 'שני',
                driver: 'אבא',
                or: [{ title: 'אומנות רב-תחומית', time: '14:45–16:00', place: 'מרכז מטאור' }],
                romi: [],
                oz: [{ title: 'מחשבים', time: '18:00–19:00', place: 'מרכז מטאור' }],
                ozLesson: null,
                schoolReturn: 'אור ועוז חוזרים יחד ב־13:30',
                romiPickup: { time: '16:00', place: 'מהגן' },
                orPickup: null
            },
            {
                day: 'שלישי',
                driver: 'אבא',
                or: [
                    { title: 'נבחרת אומנות', time: '13:30–15:00', place: 'בית הספר' },
                    { title: 'שיעור עם יפית', time: '17:30–18:15', place: 'בבית' }
                ],
                romi: [{ title: 'התעמלות קרקע', time: '17:00–17:45', place: 'מרכז מטאור' }],
                oz: [],
                ozLesson: { title: '📐 חשבון עם אמא', time: '19:00–20:00', place: 'בבית' },
                schoolReturn: 'עוז חוזר ב־13:30 מבית הספר',
                romiPickup: { time: '16:00', place: 'מהגן' },
                orPickup: { time: '15:00', place: 'מהנבחרת', note: 'בסוף נבחרת אומנות' }
            },
            {
                day: 'רביעי',
                driver: 'אמא',
                or: [{ title: 'אילוף כלבים', time: '13:30–15:00', place: null }],
                romi: [],
                oz: [{ title: 'גיטרה', time: '16:00–16:40', place: null }],
                ozLesson: null,
                schoolReturn: 'עוז חוזר ב־13:30 מבית הספר',
                romiPickup: { time: '16:00', place: 'מהגן' },
                orPickup: { time: '15:00', place: 'מאילוף כלבים', note: 'בסוף אילוף הכלבים' }
            },
            {
                day: 'חמישי',
                driver: 'אמא',
                or: [{ title: 'אנגלית', time: '18:15–19:15', place: 'מרכז מטאור' }],
                romi: [{ title: 'אנגלית', time: '17:30–18:15', place: 'מרכז מטאור' }],
                oz: [],
                ozLesson: { title: '🇬🇧 אנגלית עם אבא', time: '19:00–20:00', place: 'בבית' },
                schoolReturn: 'אור ועוז חוזרים יחד ב־13:30',
                romiPickup: { time: '16:00', place: 'מהגן' },
                orPickup: null
            },
            {
                day: 'שישי',
                driver: null,
                or: [],
                romi: [],
                oz: [],
                ozLesson: null,
                schoolReturn: null,
                romiPickup: null,
                orPickup: null
            }
        ];

        let activeFilter = 'all';
        let selectedDay = defaultDayName();

        function jsDayToHebrew() {
            return DAYS_HE[new Date().getDay()];
        }

        function defaultDayName() {
            const today = jsDayToHebrew();
            // שבת → מעבר לראשון (יום רלוונטי הבא)
            if (today === 'שבת') return 'ראשון';
            return schedule.some(d => d.day === today) ? today : 'ראשון';
        }

        function parseStartMinutes(timeStr) {
            if (!timeStr) return 9999;
            const m = String(timeStr).match(/(\d{1,2}):(\d{2})/);
            if (!m) return 9999;
            return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
        }

        function activityCard(a) {
            return `
                <div class="rounded-xl border ${a.chipClass} px-2.5 py-2 ${a.extraClass || ''}">
                    <div class="text-[10px] font-bold opacity-70">${a.personLabel}</div>
                    <div class="font-bold text-sm leading-snug">${a.title}</div>
                    <div class="text-xs font-semibold mt-0.5" dir="ltr">${a.time}</div>
                    ${a.place ? `<div class="text-[11px] font-medium mt-1 opacity-90">📍 ${a.place}</div>` : ''}
                </div>
            `;
        }

        function collectActivities(day, f) {
            const list = [];
            if (f.showOr) {
                (day.or || []).forEach(a => list.push({
                    ...a, personLabel: 'אור', chipClass: 'chip-or', sort: parseStartMinutes(a.time)
                }));
            }
            if (f.showRomi) {
                (day.romi || []).forEach(a => list.push({
                    ...a, personLabel: 'רומי', chipClass: 'chip-romi', sort: parseStartMinutes(a.time)
                }));
            }
            if (f.showOz) {
                (day.oz || []).forEach(a => list.push({
                    ...a, personLabel: 'עוז · חוגים', chipClass: 'chip-oz', sort: parseStartMinutes(a.time)
                }));
                if (day.ozLesson) {
                    list.push({
                        ...day.ozLesson,
                        personLabel: 'עוז · שיעור ערב',
                        chipClass: 'chip-oz',
                        extraClass: 'ring-1 ring-blue-300/50',
                        sort: parseStartMinutes(day.ozLesson.time)
                    });
                }
            }
            list.sort((a, b) => a.sort - b.sort);
            return list;
        }

        function filteredBlocks() {
            return {
                showOr: activeFilter === 'all' || activeFilter === 'or',
                showRomi: activeFilter === 'all' || activeFilter === 'romi',
                showOz: activeFilter === 'all' || activeFilter === 'oz',
                showDrive: activeFilter === 'all' || activeFilter === 'drive'
            };
        }

        function renderDaysBar() {
            const todayName = jsDayToHebrew();
            const bar = document.getElementById('days-bar');
            bar.innerHTML = '';
            schedule.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `day-nav-btn touch rounded-xl border text-center px-1 py-2 text-[11px] sm:text-xs font-bold transition-all ${
                    item.day === selectedDay
                        ? 'active'
                        : 'bg-white/80 text-stone-700 border-stone-200 hover:bg-stone-100'
                }`;
                btn.innerHTML = `
                    <span class="block leading-tight">${item.day}</span>
                    ${item.day === todayName ? '<span class="block text-[9px] font-bold opacity-80 mt-0.5">היום</span>' : '<span class="block text-[9px] opacity-0 mt-0.5">-</span>'}
                `;
                btn.onclick = () => {
                    selectedDay = item.day;
                    render();
                };
                bar.appendChild(btn);
            });
        }

        function pickupSection(day, f) {
            if (!f.showDrive) return '';
            const rows = [];

            if (day.schoolReturn) {
                rows.push({
                    sort: 13 * 60 + 30,
                    html: `
                    <div class="rounded-xl border chip-school px-3 py-2.5 text-xs leading-relaxed">
                        <div class="font-bold mb-0.5">🏫 חזרה מבית הספר · <span dir="ltr">13:30</span></div>
                        ${day.schoolReturn}
                    </div>`
                });
            }
            if (day.orPickup) {
                rows.push({
                    sort: parseStartMinutes(day.orPickup.time),
                    html: `
                    <div class="rounded-xl border chip-or px-3 py-2.5 text-xs leading-relaxed">
                        <div class="font-bold mb-0.5">אור · איסוף</div>
                        לאסוף את אור <strong>${day.orPickup.place}</strong>
                        ב־<span dir="ltr" class="font-extrabold">${day.orPickup.time}</span>
                        ${day.orPickup.note ? ` · ${day.orPickup.note}` : ''}
                    </div>`
                });
            }
            if (day.romiPickup) {
                rows.push({
                    sort: parseStartMinutes(day.romiPickup.time),
                    html: `
                    <div class="rounded-xl border chip-pickup px-3 py-2.5 text-xs leading-relaxed">
                        <div class="font-bold mb-0.5">רומי · איסוף מהגן</div>
                        לאסוף מהגן ב־<span dir="ltr" class="font-extrabold">${day.romiPickup.time}</span>
                    </div>`
                });
            }

            if (!rows.length) return '';
            rows.sort((a, b) => a.sort - b.sort);
            return `<div class="mt-3 space-y-2"><h3 class="text-xs font-extrabold text-stone-800">הסעות ואיסופים</h3>${rows.map(r => r.html).join('')}</div>`;
        }

        function render() {
            const todayName = jsDayToHebrew();
            document.getElementById('today-badge').textContent = `היום: ${todayName}`;
            renderDaysBar();

            const day = schedule.find(d => d.day === selectedDay);
            const root = document.getElementById('schedule-root');
            if (!day) {
                root.innerHTML = '';
                return;
            }

            const isToday = day.day === todayName;
            const f = filteredBlocks();

            const driverHtml = day.driver
                ? `<span class="inline-flex items-center gap-1 rounded-full border chip-drive px-2.5 py-1 text-xs font-bold">🚗 הסעות: ${day.driver}</span>`
                : `<span class="inline-flex items-center rounded-full border border-stone-200 bg-stone-50 px-2.5 py-1 text-xs font-bold text-stone-400">אין הסעות</span>`;

            const sorted = collectActivities(day, f);
            let activities = sorted.map(activityCard).join('');
            if (!activities && activeFilter !== 'drive') {
                activities = `<p class="empty-slot text-xs col-span-full py-2">אין חוגים ביום זה / בסינון הזה</p>`;
            }

            root.innerHTML = `
                <article class="bg-white/95 rounded-2xl border border-stone-200 p-3.5 sm:p-5 ${isToday ? 'ring-2 ring-teal-700 shadow-lg shadow-teal-900/10' : 'shadow-sm'}">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <div class="flex items-center gap-2">
                            <h2 class="text-xl sm:text-2xl font-extrabold text-stone-900">יום ${day.day}</h2>
                            ${isToday ? '<span class="text-[10px] font-bold bg-teal-800 text-white px-2 py-0.5 rounded-full">היום</span>' : ''}
                        </div>
                        ${f.showDrive ? driverHtml : ''}
                    </div>

                    ${activeFilter !== 'drive' ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">${activities}</div>` : ''}
                    ${pickupSection(day, f)}
                </article>
            `;
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.dataset.filter;
                render();
            });
        });

        render();
    </script>
</body>
</html>
