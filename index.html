<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f766e">
    <title>לוח הסעות וחוגים · משפחת ברק</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --or: #0d9488;
            --romi: #c2410c;
            --oz: #1d4ed8;
            --bg: #f4f1eb;
        }
        body {
            font-family: 'Rubik', sans-serif;
            background:
                radial-gradient(ellipse 90% 60% at 10% -10%, rgba(13, 148, 136, 0.12), transparent 50%),
                radial-gradient(ellipse 70% 50% at 100% 0%, rgba(194, 65, 12, 0.08), transparent 45%),
                var(--bg);
            color: #1c1917;
            -webkit-tap-highlight-color: transparent;
        }
        .day-card { transition: transform .15s ease, box-shadow .15s ease; }
        .day-card.is-today {
            box-shadow: 0 0 0 2px #0f766e, 0 12px 28px rgba(15, 118, 110, 0.18);
        }
        .chip-or { background: #ccfbf1; color: #115e59; border-color: #99f6e4; }
        .chip-romi { background: #ffedd5; color: #9a3412; border-color: #fed7aa; }
        .chip-oz { background: #dbeafe; color: #1e3a8a; border-color: #bfdbfe; }
        .chip-drive { background: #fef3c7; color: #92400e; border-color: #fde68a; }
        .chip-school { background: #f3e8ff; color: #6b21a8; border-color: #e9d5ff; }
        .filter-btn.active {
            background: #0f766e;
            color: #fff;
            border-color: #0f766e;
        }
        .empty-slot { color: #a8a29e; font-style: italic; }
    </style>
</head>
<body class="min-h-screen antialiased">

    <header class="sticky top-0 z-40 border-b border-stone-200/80 bg-[#f4f1eb]/95 backdrop-blur-md">
        <div class="max-w-5xl mx-auto px-3 sm:px-5 py-3 sm:py-4">
            <div class="flex flex-wrap items-end justify-between gap-2">
                <div>
                    <p class="text-[10px] sm:text-xs font-bold tracking-wide text-teal-800 uppercase">מערכת שבועית</p>
                    <h1 class="text-xl sm:text-3xl font-extrabold text-stone-900 leading-tight">לוח הסעות וחוגים</h1>
                </div>
                <div id="today-badge" class="text-xs font-bold px-3 py-1.5 rounded-full bg-teal-800 text-white"></div>
            </div>

            <div class="mt-3 flex gap-1.5 overflow-x-auto pb-0.5">
                <button type="button" class="filter-btn active shrink-0 px-3 py-1.5 rounded-full border text-xs font-bold" data-filter="all">הכל</button>
                <button type="button" class="filter-btn shrink-0 px-3 py-1.5 rounded-full border border-stone-300 text-xs font-bold text-stone-700" data-filter="or">אור</button>
                <button type="button" class="filter-btn shrink-0 px-3 py-1.5 rounded-full border border-stone-300 text-xs font-bold text-stone-700" data-filter="romi">רומי</button>
                <button type="button" class="filter-btn shrink-0 px-3 py-1.5 rounded-full border border-stone-300 text-xs font-bold text-stone-700" data-filter="oz">עוז</button>
                <button type="button" class="filter-btn shrink-0 px-3 py-1.5 rounded-full border border-stone-300 text-xs font-bold text-stone-700" data-filter="drive">הסעות</button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-3 sm:px-5 py-4 sm:py-6 space-y-3 sm:space-y-4" id="schedule-root"></main>

    <footer class="max-w-5xl mx-auto px-3 sm:px-5 pb-8 text-center text-[11px] text-stone-500">
        משפחת ברק · לוח חוגים והסעות · עדכון ידני
    </footer>

    <script>
        const DAYS_HE = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];

        const schedule = [
            {
                day: 'ראשון',
                driver: 'אבא',
                or: [{ title: 'שיעור עם יפית', time: '15:30–16:15' }],
                romi: [],
                oz: [{ title: 'ג׳ודו', time: '16:15–17:15' }],
                ozLesson: null,
                schoolReturn: 'אור ועוז חוזרים יחד'
            },
            {
                day: 'שני',
                driver: 'אבא',
                or: [{ title: 'אומנות רב-תחומית', time: '14:45–16:00' }],
                romi: [{ title: 'אנגלית', time: '16:00–16:45' }],
                oz: [{ title: 'מחשבים', time: '18:00–19:00' }],
                ozLesson: null,
                schoolReturn: 'אור ועוז חוזרים יחד'
            },
            {
                day: 'שלישי',
                driver: 'אבא',
                or: [
                    { title: 'נבחרת אומנות', time: '13:30–15:00' },
                    { title: 'שיעור עם יפית', time: '17:30–18:15' }
                ],
                romi: [{ title: 'התעמלות קרקע', time: '17:00–17:45' }],
                oz: [],
                ozLesson: { title: '📐 חשבון עם אמא', time: '19:00–20:00' },
                schoolReturn: 'לא חוזרים יחד (לאור יש נבחרת ב־13:30)'
            },
            {
                day: 'רביעי',
                driver: 'אמא',
                or: [{ title: 'אילוף כלבים', time: '13:30–15:00' }],
                romi: [],
                oz: [{ title: 'גיטרה', time: '16:00–16:40' }],
                ozLesson: null,
                schoolReturn: 'עוז חוזר ב־13:30, לאור יש אילוף'
            },
            {
                day: 'חמישי',
                driver: 'אמא',
                or: [{ title: 'אנגלית', time: '18:15–19:15' }],
                romi: [{ title: 'אנגלית', time: '17:30–18:15' }],
                oz: [],
                ozLesson: { title: '🇬🇧 אנגלית עם אבא', time: '19:00–20:00' },
                schoolReturn: 'אור ועוז חוזרים יחד'
            },
            {
                day: 'שישי',
                driver: null,
                or: [],
                romi: [],
                oz: [],
                ozLesson: null,
                schoolReturn: null
            }
        ];

        let activeFilter = 'all';

        function jsDayToHebrew() {
            // JS: 0=Sunday ... matches Hebrew week start
            return DAYS_HE[new Date().getDay()];
        }

        function activityHtml(items, chipClass, personLabel) {
            if (!items || items.length === 0) {
                return `<p class="empty-slot text-xs">אין חוג</p>`;
            }
            return items.map(a => `
                <div class="rounded-xl border ${chipClass} px-2.5 py-2">
                    <div class="text-[10px] font-bold opacity-70">${personLabel}</div>
                    <div class="font-bold text-sm leading-snug">${a.title}</div>
                    <div class="text-xs font-semibold mt-0.5" dir="ltr">${a.time}</div>
                </div>
            `).join('');
        }

        function dayMatchesFilter(day) {
            if (activeFilter === 'all') return true;
            if (activeFilter === 'drive') return !!day.driver || !!day.schoolReturn;
            if (activeFilter === 'or') return day.or.length > 0;
            if (activeFilter === 'romi') return day.romi.length > 0;
            if (activeFilter === 'oz') return day.oz.length > 0 || !!day.ozLesson;
            return true;
        }

        function filteredBlocks(day) {
            const showOr = activeFilter === 'all' || activeFilter === 'or';
            const showRomi = activeFilter === 'all' || activeFilter === 'romi';
            const showOz = activeFilter === 'all' || activeFilter === 'oz';
            const showDrive = activeFilter === 'all' || activeFilter === 'drive';
            return { showOr, showRomi, showOz, showDrive };
        }

        function render() {
            const todayName = jsDayToHebrew();
            document.getElementById('today-badge').textContent = `היום: ${todayName}`;

            const root = document.getElementById('schedule-root');
            root.innerHTML = '';

            const visible = schedule.filter(dayMatchesFilter);
            if (visible.length === 0) {
                root.innerHTML = `<div class="text-center text-stone-500 py-10 text-sm">אין פעילויות בסינון הזה</div>`;
                return;
            }

            visible.forEach(day => {
                const isToday = day.day === todayName;
                const f = filteredBlocks(day);
                const card = document.createElement('article');
                card.className = `day-card bg-white/90 rounded-2xl border border-stone-200 p-3.5 sm:p-4 ${isToday ? 'is-today' : ''}`;

                const driverHtml = day.driver
                    ? `<span class="inline-flex items-center gap-1 rounded-full border chip-drive px-2.5 py-1 text-xs font-bold">🚗 הסעות: ${day.driver}</span>`
                    : `<span class="inline-flex items-center rounded-full border border-stone-200 bg-stone-50 px-2.5 py-1 text-xs font-bold text-stone-400">אין הסעות</span>`;

                let activities = '';
                if (f.showOr) activities += activityHtml(day.or, 'chip-or', 'אור');
                if (f.showRomi) activities += activityHtml(day.romi, 'chip-romi', 'רומי');
                if (f.showOz) {
                    activities += activityHtml(day.oz, 'chip-oz', 'עוז · חוגים');
                    if (day.ozLesson) {
                        activities += `
                            <div class="rounded-xl border chip-oz px-2.5 py-2 ring-1 ring-blue-300/50">
                                <div class="text-[10px] font-bold opacity-70">עוז · שיעור ערב</div>
                                <div class="font-bold text-sm leading-snug">${day.ozLesson.title}</div>
                                <div class="text-xs font-semibold mt-0.5" dir="ltr">${day.ozLesson.time}</div>
                            </div>`;
                    } else if (activeFilter === 'oz' && day.oz.length === 0) {
                        // already empty handled
                    }
                }

                if (!activities && activeFilter !== 'drive') {
                    activities = `<p class="empty-slot text-xs col-span-full">אין חוגים היום</p>`;
                }

                const schoolHtml = (f.showDrive && day.schoolReturn)
                    ? `<div class="mt-3 rounded-xl border chip-school px-3 py-2 text-xs leading-relaxed">
                            <span class="font-bold">חזרה מבית הספר (13:30):</span> ${day.schoolReturn}
                       </div>`
                    : '';

                const driveOnlyNote = (activeFilter === 'drive' && day.driver)
                    ? `<div class="mt-2 text-sm font-bold text-amber-900">אחראי/ת הסעות היום: ${day.driver}</div>`
                    : '';

                card.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <div class="flex items-center gap-2">
                            <h2 class="text-lg sm:text-xl font-extrabold text-stone-900">${day.day}</h2>
                            ${isToday ? '<span class="text-[10px] font-bold bg-teal-800 text-white px-2 py-0.5 rounded-full">היום</span>' : ''}
                        </div>
                        ${f.showDrive ? driverHtml : ''}
                    </div>
                    ${driveOnlyNote}
                    ${activeFilter !== 'drive' ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">${activities}</div>` : ''}
                    ${schoolHtml}
                `;
                root.appendChild(card);
            });
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.dataset.filter;
                render();
            });
        });

        render();
    </script>
</body>
</html>
