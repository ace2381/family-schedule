            {
                name: 'ערב חג שבועות',
                ranges: [{ days: 'חמישי', label: '10.6.27', start: '2027-06-10', end: '2027-06-10' }]
            }
        ];

        let activeFilter = 'all';
        let selectedDay = defaultDayName();

        function jsDayToHebrew() {
            return DAYS_HE[new Date().getDay()];
        }

        function defaultDayName() {
            const today = jsDayToHebrew();
            if (today === 'שבת') return 'ראשון';
            return schedule.some(d => d.day === today) ? today : 'ראשון';
        }

        function parseStartMinutes(timeStr) {
            if (!timeStr) return 9999;
            const m = String(timeStr).match(/(\d{1,2}):(\d{2})/);
            if (!m) return 9999;
            return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
        }

        function activityCard(a) {
            return `
                <div class="rounded-xl border ${a.chipClass} px-2.5 py-2 ${a.extraClass || ''}">
                    <div class="text-[10px] font-bold opacity-70">${a.personLabel}</div>
                    <div class="font-bold text-sm leading-snug">${a.title}</div>
                    <div class="text-xs font-semibold mt-0.5" dir="ltr">${a.time}</div>
                    ${a.place ? `<div class="text-[11px] font-medium mt-1 opacity-90">📍 ${a.place}</div>` : ''}
                    ${a.teacher ? `<div class="text-[10px] mt-0.5 opacity-70">${a.teacher}</div>` : ''}
                </div>
            `;
        }

        function collectActivities(day, f) {
            const list = [];
            if (f.showOr) {
                (day.or || []).forEach(a => list.push({
                    ...a, personLabel: 'אור', chipClass: 'chip-or', sort: parseStartMinutes(a.time)
                }));
            }
            if (f.showRomi) {
                (day.romi || []).forEach(a => list.push({
                    ...a, personLabel: 'רומי', chipClass: 'chip-romi', sort: parseStartMinutes(a.time)
                }));
            }
            if (f.showOz) {
                (day.oz || []).forEach(a => list.push({
                    ...a, personLabel: 'עוז', chipClass: 'chip-oz', sort: parseStartMinutes(a.time)
                }));
                if (day.ozLesson) {
                    list.push({
                        ...day.ozLesson,
                        personLabel: 'עוז',
                        chipClass: 'chip-oz',
                        sort: parseStartMinutes(day.ozLesson.time)
                    });
                }
            }
            list.sort((a, b) => a.sort - b.sort);
            return list;
        }

        function filteredBlocks() {
            return {
                showOr: activeFilter === 'all' || activeFilter === 'or',
                showRomi: activeFilter === 'all' || activeFilter === 'romi',
                showOz: activeFilter === 'all' || activeFilter === 'oz',
                showDrive: activeFilter === 'all' || activeFilter === 'drive'
            };
        }

        function renderDaysBar() {
            const todayName = jsDayToHebrew();
            const bar = document.getElementById('days-bar');
            bar.innerHTML = '';
            if (activeFilter === 'oz-school' || activeFilter === 'or-school' || activeFilter === 'holidays') {
                bar.classList.add('opacity-40', 'pointer-events-none');
            } else {
                bar.classList.remove('opacity-40', 'pointer-events-none');
            }
            schedule.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `day-nav-btn touch rounded-xl border text-center px-1 py-2 text-[11px] sm:text-xs font-bold transition-all ${
                    item.day === selectedDay
                        ? 'active'
                        : 'bg-white/80 text-stone-700 border-stone-200 hover:bg-stone-100'
                }`;
                btn.innerHTML = `
                    <span class="block leading-tight">${item.day}</span>
                    ${item.day === todayName ? '<span class="block text-[9px] font-bold opacity-80 mt-0.5">היום</span>' : '<span class="block text-[9px] opacity-0 mt-0.5">-</span>'}
                `;
                btn.onclick = () => {
                    selectedDay = item.day;
                    render();
                };
                bar.appendChild(btn);
            });
        }

        function nameClass(name) {
            if (name === 'אור') return 'name-or';
            if (name === 'רומי') return 'name-romi';
            if (name === 'עוז') return 'name-oz';
            return '';
        }

        function formatNames(names) {
            return names.map((n, i) => {
                const sep = i === 0 ? '' : (i === names.length - 1 ? ' ו' : ', ');
                return `${sep}<span class="font-extrabold ${nameClass(n)}">${n}</span>`;
            }).join('');
        }

        function schoolChipClass(names) {
            const hasOr = names.includes('אור');
            const hasOz = names.includes('עוז');
            if (hasOr && hasOz) return 'chip-school-both';
            if (hasOr) return 'chip-or';
            if (hasOz) return 'chip-oz';
            return 'chip-drive';
        }

        function pickupSection(day, f) {
            if (!f.showDrive) return '';
            const rows = [];

            if (day.schoolReturn) {
                const sr = day.schoolReturn;
                const t = sr.time || '13:30';
                rows.push({
                    sort: parseStartMinutes(t),
                    html: `
                    <div class="rounded-xl border ${schoolChipClass(sr.names)} px-3 py-2.5 text-xs leading-relaxed">
                        <div class="text-sm font-extrabold mb-0.5">${formatNames(sr.names)}</div>
                        <div>${sr.detail}</div>
                    </div>`
                });
            }
            if (day.orPickup) {
                rows.push({
                    sort: parseStartMinutes(day.orPickup.time),
                    html: `
                    <div class="rounded-xl border chip-or px-3 py-2.5 text-xs leading-relaxed">
                        <div class="text-sm font-extrabold mb-0.5 name-or">אור</div>
                        <div>
                            איסוף <strong>${day.orPickup.place}</strong>
                            ב־<span dir="ltr" class="font-extrabold">${day.orPickup.time}</span>
                            ${day.orPickup.note ? ` · ${day.orPickup.note}` : ''}
                        </div>
                    </div>`
                });
            }
            if (day.romiPickup) {
                rows.push({
                    sort: parseStartMinutes(day.romiPickup.time),
                    html: `
                    <div class="rounded-xl border chip-romi px-3 py-2.5 text-xs leading-relaxed">
                        <div class="text-sm font-extrabold mb-0.5 name-romi">רומי</div>
                        <div>
                            איסוף מהגן ב־<span dir="ltr" class="font-extrabold">${day.romiPickup.time}</span>
                        </div>
                    </div>`
                });
            }

            if (!rows.length) return '';
            rows.sort((a, b) => a.sort - b.sort);
            return `<div class="mt-3 space-y-2"><h3 class="text-xs font-extrabold text-stone-800">הסעות ואיסופים</h3>${rows.map(r => r.html).join('')}</div>`;
        }

        function renderSchoolGrid({ title, subtitle, data, periods, headClass, note }) {
            const days = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי'];
            const todayName = jsDayToHebrew();

            const head = days.map(d => `
                <th class="p-1.5 text-[11px] sm:text-xs font-extrabold border border-stone-200 ${headClass} text-white ${d === todayName ? 'ring-2 ring-inset ring-amber-300' : ''}">
                    ${d}${d === todayName ? '<div class="text-[9px] font-bold opacity-90">היום</div>' : ''}
                </th>
            `).join('');

            const rows = periods.map((period, idx) => {
                const cells = days.map(d => {
                    const lesson = (data[d] || [])[idx];
                    if (!lesson) {
                        return `<td class="tt-cell p-1 border border-stone-200 tt-subj-empty text-[10px] text-center align-top">—</td>`;
                    }
                    return `
                        <td class="tt-cell p-1 border border-stone-200 ${lesson.css} align-top">
                            <div class="font-bold text-[10px] sm:text-[11px] leading-tight">${lesson.subject}</div>
                            ${lesson.teacher ? `<div class="text-[9px] opacity-70 leading-tight mt-0.5">${lesson.teacher}</div>` : ''}
                        </td>`;
                }).join('');
                return `
                    <tr>
                        <th class="p-1.5 border border-stone-200 bg-slate-100 text-[10px] sm:text-xs font-bold whitespace-nowrap align-top">
                            <div>${period.num}</div>
                            ${period.time ? `<div class="font-semibold opacity-70" dir="ltr">${period.time}</div>` : ''}
                        </th>
                        ${cells}
                    </tr>`;
            }).join('');

            return `
                <article class="bg-white/95 rounded-2xl border border-stone-200 p-3 sm:p-4 shadow-sm space-y-3">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <div>
                            <h2 class="text-lg sm:text-xl font-extrabold ${title.className}">${title.text}</h2>
                            <p class="text-xs text-stone-500">${subtitle}</p>
                        </div>
                    </div>
                    ${note ? `<p class="text-[11px] text-stone-500 leading-relaxed">${note}</p>` : ''}
                    <div class="overflow-x-auto custom-scrollbar -mx-1 px-1">
                        <table class="w-full min-w-[640px] border-collapse text-right">
                            <thead>
                                <tr>
                                    <th class="p-1.5 text-[11px] font-extrabold border border-stone-200 bg-slate-700 text-white">שיעור</th>
                                    ${head}
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </article>
            `;
        }

        function renderOzSchoolGrid() {
            return renderSchoolGrid({
                title: { text: 'מערכת שעות · עוז', className: 'name-oz' },
                subtitle: 'כיתה ב׳ ה · בית הספר',
                data: ozSchool,
                periods: OZ_PERIODS,
                headClass: 'bg-blue-600',
                note: 'שיעור 7 מופיע רק ביום רביעי, בלי שעה במערכת.'
            });
        }

        function renderOrSchoolGrid() {
            return renderSchoolGrid({
                title: { text: 'מערכת שעות · אור', className: 'name-or' },
                subtitle: 'בית הספר',
                data: orSchool,
                periods: PERIODS,
                headClass: 'bg-green-700',
                note: 'שעות השיעורים כמו במערכת של עוז.'
            });
        }

        function todayAtMidnight() {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function holidayStatus(range) {
            const now = todayAtMidnight();
            const start = new Date(`${range.start}T00:00:00`);
            const end = new Date(`${range.end}T00:00:00`);
            if (now >= start && now <= end) return 'current';
            if (now < start) return 'future';
            return 'past';
        }

        function daysUntil(range) {
            const now = todayAtMidnight();
            const start = new Date(`${range.start}T00:00:00`);
            return Math.round((start - now) / 86400000);
        }

        function renderHolidays() {
            const enriched = holidays.map(h => {
                const statuses = h.ranges.map(holidayStatus);
                const isCurrent = statuses.includes('current');
                const isPast = statuses.every(s => s === 'past');
                const firstFuture = h.ranges.find(r => holidayStatus(r) === 'future');
                return { ...h, isCurrent, isPast, firstFuture };
            });

            const nextHoliday = enriched.find(h => !h.isPast && !h.isCurrent);

            const cards = enriched.map(h => {
                const isNext = nextHoliday && nextHoliday.name === h.name;
                let frame = 'border-stone-200 bg-white/95';
                let badge = '';

                if (h.isCurrent) {
                    frame = 'border-emerald-500 bg-emerald-50 ring-2 ring-emerald-500/40';
                    badge = '<span class="text-[10px] font-bold bg-emerald-600 text-white px-2 py-0.5 rounded-full">עכשיו</span>';
                } else if (isNext) {
                    frame = 'border-emerald-300 bg-emerald-50/50';
                    const d = daysUntil(h.firstFuture);
                    badge = `<span class="text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">הקרוב · בעוד ${d} ימים</span>`;
                } else if (h.isPast) {
                    frame = 'border-stone-200 bg-stone-50 opacity-60';
                    badge = '<span class="text-[10px] font-bold bg-stone-200 text-stone-600 px-2 py-0.5 rounded-full">עבר</span>';
                }

                const ranges = h.ranges.map(r => `
                    <div class="flex items-center justify-between gap-2 rounded-lg border border-emerald-200/70 bg-white/80 px-2.5 py-1.5">
                        <span class="text-[11px] font-semibold text-stone-600">${r.days}</span>
                        <span class="text-xs font-extrabold text-emerald-800" dir="ltr">${r.label}</span>
                    </div>
                `).join('');

                return `
                    <article class="rounded-2xl border ${frame} p-3 shadow-sm space-y-2">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <h3 class="text-sm sm:text-base font-extrabold text-stone-900">${h.name}</h3>
                            ${badge}
                        </div>
                        <div class="space-y-1.5">${ranges}</div>
                    </article>
                `;
            }).join('');

            return `
                <section class="space-y-3">
                    <div class="bg-white/95 rounded-2xl border border-emerald-200 p-3.5 sm:p-4 shadow-sm">
                        <h2 class="text-lg sm:text-xl font-extrabold text-emerald-800">לוח חופשות · תשפ״ז</h2>
                        <p class="text-xs text-stone-500 mt-0.5">חופשות בית הספר והגן · מסומן מה קורה עכשיו ומה הקרוב</p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">${cards}</div>
                </section>
            `;
        }

        function render() {
            const todayName = jsDayToHebrew();
            document.getElementById('today-badge').textContent = `היום: ${todayName}`;
            renderDaysBar();

            const root = document.getElementById('schedule-root');

            if (activeFilter === 'oz-school') {
                root.innerHTML = renderOzSchoolGrid();
                return;
            }

            if (activeFilter === 'or-school') {
                root.innerHTML = renderOrSchoolGrid();
                return;
            }

            if (activeFilter === 'holidays') {
                root.innerHTML = renderHolidays();
                return;
            }

            const day = schedule.find(d => d.day === selectedDay);
            if (!day) {
                root.innerHTML = '';
                return;
            }

            const isToday = day.day === todayName;
            const f = filteredBlocks();

            const driverHtml = day.driver
                ? `<span class="inline-flex items-center gap-1 rounded-full border chip-drive px-2.5 py-1 text-xs font-bold">🚗 הסעות: ${day.driver}</span>`
                : `<span class="inline-flex items-center rounded-full border border-stone-200 bg-stone-50 px-2.5 py-1 text-xs font-bold text-stone-400">אין הסעות</span>`;

            const sorted = collectActivities(day, f);
            let activities = sorted.map(activityCard).join('');
            if (!activities && activeFilter !== 'drive') {
                activities = `<p class="empty-slot text-xs col-span-full py-2">אין חוגים ביום זה / בסינון הזה</p>`;
            }

            root.innerHTML = `
                <article class="bg-white/95 rounded-2xl border border-stone-200 p-3.5 sm:p-5 ${isToday ? 'ring-2 ring-slate-600 shadow-lg shadow-slate-900/10' : 'shadow-sm'}">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <div class="flex items-center gap-2">
                            <h2 class="text-xl sm:text-2xl font-extrabold text-stone-900">יום ${day.day}</h2>
                            ${isToday ? '<span class="text-[10px] font-bold bg-slate-700 text-white px-2 py-0.5 rounded-full">היום</span>' : ''}
                        </div>
                        ${f.showDrive ? driverHtml : ''}
                    </div>

                    ${activeFilter !== 'drive' ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">${activities}</div>` : ''}
                    ${pickupSection(day, f)}
                </article>
            `;
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.dataset.filter;
                render();
            });
        });

        render();
    </script>
</body>
</html>
